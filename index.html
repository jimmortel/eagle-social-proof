<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="fc:frame" content='{"version":"next","imageUrl":"https://eagle-social-proof.vercel.app/preview.png","button":{"title":"Lancer Eagle-Pi","action":{"type":"launch_frame","name":"Eagle-Pi","url":"https://eagle-social-proof.vercel.app/"}}}'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle-Pi Social Proof</title>
    <script src="https://cdn.jsdelivr.net/npm/@farcaster/frame-sdk/dist/index.min.js"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { 
            width: 320px; border: 1px solid #1e293b; border-radius: 24px; padding: 30px;
            background: linear-gradient(160deg, #0f172a 0%, #020617 100%); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative;
        }
        .card::before { content: ""; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(45deg, #3b82f6, transparent, #3b82f6); border-radius: 26px; z-index: -1; opacity: 0.3; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #3b82f6; margin-bottom: 15px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .rank-label { color: #64748b; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        .rank-name { color: #f8fafc; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }
        h2 { margin: 5px 0; font-size: 1.5rem; color: #f1f5f9; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 25px 0; }
        .stat-box { background: rgba(30, 41, 59, 0.5); padding: 12px; border-radius: 12px; border: 1px solid #1e293b; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: 800; color: #3b82f6; }
        .stat-lbl { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        button { 
            background: #3b82f6; color: white; border: none; width: 100%; padding: 15px; 
            border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .footer { margin-top: 25px; font-size: 0.65rem; color: #475569; letter-spacing: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="rank-label">Eagle-Pi Protocol</div>
    <img id="userImg" class="avatar" src="https://via.placeholder.com/100" alt="PFP">
    <div class="rank-name" id="rankTitle">RANG : EAGLET 🦅</div>
    <h2 id="userName">Chargement...</h2>
    
    <div class="stats-grid">
        <div class="stat-box"><span class="stat-val" id="userDays">--</span><span class="stat-lbl">Jours FC</span></div>
        <div class="stat-box"><span class="stat-val">GENESIS</span><span class="stat-lbl">Badge</span></div>
    </div>

    <button onclick="payUSDC()">Passer Sky Hunter (1 USDC)</button>
    <div class="footer">EAGLE-PI SYSTEM</div>
</div>

<script>
    const WALLET_RECEPTION = "GU5dNvMQKoUiVJvZ5HUgrv3CxtrR5ujxfHK2HPT6Z6bV"; // <--- TON ADRESSE ICI
    const USDC_SOLANA = "EPjFW36v3qNSNRuv7P5B1GuqAbtWWxh4f97nzaxgSPT";
    const sdk = window.farcaster.FrameSDK;

    async function start() {
        sdk.actions.ready();
        const context = await sdk.context;
        if (context && context.user) {
            document.getElementById('userName').innerText = context.user.displayName || context.user.username;
            document.getElementById('userImg').src = context.user.pfpUrl;
            document.getElementById('userDays').innerText = Math.floor(Math.random() * 300) + 10;
        }
    }

    async function payUSDC() {
        try {
            // Commande de paiement via le SDK Frame v2
            await sdk.actions.sendTransaction({
                chainId: "solana:mainnet",
                method: "transfer",
                params: {
                    to: WALLET_RECEPTION,
                    amount: "1000000", // 1 USDC = 1,000,000 micro-unités
                    token: USDC_SOLANA
                }
            });
            alert("Paiement réussi ! Bienvenue Sky Hunter.");
            document.getElementById('rankTitle').innerText = "RANG : SKY HUNTER ⚡";
            document.body.style.background = "#0f172a";
        } catch (err) {
            console.error(err);
        }
    }
    start();
</script>
</body>
</html>
