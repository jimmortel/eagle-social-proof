<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle-Pi v2</title>
    <script src="https://cdn.jsdelivr.net/npm/@farcaster/frame-sdk/dist/index.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div id="main-card" class="bg-gradient-to-br from-blue-900 to-black w-full max-w-sm rounded-3xl p-6 text-center border border-blue-500 shadow-2xl">
        <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
            <span class="text-3xl">🦅</span>
        </div>
        
        <h1 class="text-2xl font-bold mb-2">Eagle-Pi Proof</h1>
        
        <div id="status-area" class="my-6 p-4 bg-black/40 rounded-xl border border-white/10">
            <p id="user-name" class="text-lg font-semibold text-blue-300">Initialisation...</p>
            <p id="user-fid" class="text-xs text-gray-500 mt-1"></p>
        </div>

        <button id="pay-button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50">
            🚀 Passer Sky Hunter (1 USDC)
        </button>
        
        <p class="text-[10px] text-gray-500 mt-4 uppercase tracking-widest">Solana Mainnet | 0.001 SOL Fee</p>
    </div>

    <script>
        // On attend que le DOM soit chargé
        window.addEventListener('load', async () => {
            const statusText = document.getElementById('user-name');
            const fidText = document.getElementById('user-fid');
            const sdk = window.farcaster?.FrameSDK || window.parent?.farcaster?.FrameSDK;

            if (!sdk) {
                statusText.innerText = "⚠️ SDK Non Détecté";
                statusText.classList.add('text-red-400');
                return;
            }

            try {
                // On signale au SDK qu'on est prêt
                sdk.actions.ready();

                // On récupère le contexte (pseudo, FID, etc.)
                const context = await sdk.context;
                
                if (context && context.user) {
                    statusText.innerText = "Bienvenue, " + context.user.displayName;
                    fidText.innerText = "FID: " + context.user.fid;
                    statusText.classList.replace('text-blue-300', 'text-green-400');
                } else {
                    statusText.innerText = "Connecté (Hors Warpcast)";
                }
            } catch (err) {
                statusText.innerText = "Erreur de connexion";
                console.error(err);
            }
        });

        // Gestion du bouton de paiement
        document.getElementById('pay-button').addEventListener('click', async () => {
            const sdk = window.farcaster?.FrameSDK;
            if (!sdk) return alert("Ouvre l'app dans Warpcast pour payer");

            try {
                await sdk.actions.sendTransaction({
                    chainId: "solana:5eykt4UsFvXYqx2bK7W8vwSmdA26J5ST",
                    method: "eth_sendTransaction",
                    params: {
                        to: "C6Z5v59B8BfNq3p1y9j9j9j9j9j9j9j9j9j9S7Uv",
                        value: "1000000", // 1 USDC
                    }
                });
            } catch (e) {
                console.log("Transaction annulée ou erreur");
            }
        });
    </script>
</body>
</html>
